services:
  db:
    image: mysql:8.0
    container_name: ictu_internship_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-ictu_internship}
      MYSQL_USER: ${DB_USER:-ictu}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ictu}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Chỉ chạy khi volume DB mới (lần đầu). Volume cũ: dựa vào seed Python khi backend start.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/002_admin_user.sql:/docker-entrypoint-initdb.d/02-admin-user.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI) — seed admin tự chạy trước uvicorn (dev)
  backend:
    image: python:3.11-slim
    container_name: ictu_internship_backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./database:/database:ro
    command: sh /app/scripts/docker_entrypoint.sh
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      # Tài khoản admin cố định cho cả team (idempotent — đã có thì giữ nguyên)
      ADMIN_SEED_ON_STARTUP: ${ADMIN_SEED_ON_STARTUP:-true}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@ictu.edu.vn}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-Admin@123}
      ADMIN_SEED_FULL_NAME: ${ADMIN_SEED_FULL_NAME:-System Admin}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Frontend production build (nginx) — chạy nhanh: docker compose up --build -d
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ictu_internship_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

  # Frontend dev (Vite hot-reload): docker compose --profile dev up frontend-dev
  frontend-dev:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: ictu_internship_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  frontend_node_modules:
